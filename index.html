<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NxLife Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fcfbf8; color: #4a3b32; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-nxl { background-color: #8c705f; }
        .card-premium { 
            border: none; border-radius: 20px; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            transition: transform 0.3s ease;
        }
        .card-premium:hover { transform: translateY(-5px); }
        .text-gold { color: #b8975a; }
        .loading-pulse { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-nxl shadow-sm mb-4">
        <div class="container text-center">
            <span class="navbar-brand mb-0 h4 w-100">🕊️ NxLife Leader Dashboard</span>
        </div>
    </nav>

    <div class="container">
        <div class="row g-3">
            <div class="col-6">
                <div class="card card-premium text-center p-4">
                    <small class="text-muted text-uppercase">Family</small>
                    <h1 id="ui-family" class="text-gold fw-bold loading-pulse">...</h1>
                </div>
            </div>
            <div class="col-6">
                <div class="card card-premium text-center p-4">
                    <small class="text-muted text-uppercase">Friends</small>
                    <h1 id="ui-friends" class="text-dark fw-bold loading-pulse">...</h1>
                </div>
            </div>
        </div>
        <div class="text-center mt-4">
            <small class="text-muted" id="ui-update">กำลังดึงข้อมูลล่าสุด...</small>
        </div>
    </div>

    <script>
        // ⚠️ นำ URL ที่ได้จาก New Deployment ของ GAS มาใส่ที่นี่
        const API_URL = 'YOUR_GAS_WEB_APP_URL_HERE';

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // อัปเดต UI และเอา Effect Loading ออก
                const famEl = document.getElementById('ui-family');
                const friEl = document.getElementById('ui-friends');
                
                famEl.innerText = data.totalFamily;
                friEl.innerText = data.totalFriends;
                famEl.classList.remove('loading-pulse');
                friEl.classList.remove('loading-pulse');
                
                document.getElementById('ui-update').innerText = 'อัปเดตล่าสุด: ' + data.lastUpdate;
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('ui-update').innerText = 'ไม่สามารถดึงข้อมูลได้';
            }
        }

        // เริ่มดึงข้อมูลทันทีที่เปิดเว็บ
        fetchData();
    </script>
</body>
</html>
