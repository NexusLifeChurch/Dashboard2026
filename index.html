<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NxLife Community</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --navy: #0F172A;
            --orange: #C06428; /* ส้มอิฐหม่นตามโลโก้จริง */
            --orange-light: #FDF3EC; 
            --white: #FFFFFF;
            --bg-color: #FAFAFB;
            --gray-text: #64748B;
            --gray-border: #E2E8F0;
            --shadow-premium: 0 10px 30px rgba(0,0,0,0.04);
            --shadow-menu: 0 8px 20px rgba(192, 100, 40, 0.12); 
            --shadow-bottom: 0 -5px 20px rgba(0,0,0,0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-fast: all 0.1s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #E5E7EB; 
            color: var(--navy);
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        #app-container {
            width: 100%; max-width: 430px; height: 100%;
            background-color: var(--bg-color); position: relative; overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        /* App Version Label */
        .app-version {
            position: absolute; bottom: 15px; width: 100%; text-align: center;
            font-size: 11px; color: #FF4500; font-weight: bold; /* เปลี่ยนเป็นสีส้มแดงเพื่อสังเกตง่าย */
            font-family: 'Urbanist', sans-serif; opacity: 0.8; z-index: 100;
        }

        /* ================================
           Screen 1: Splash Screen
           ================================ */
        #screen-splash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--white); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 30;
            transition: opacity 0.8s ease-in-out; 
        }
        
        .splash-content { transform: translateY(-12vh); z-index: 2; position: relative; }
        .splash-logo-img { width: 210px; animation: heartbeat 1.5s infinite; }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.08); } 
            28% { transform: scale(1); }
            42% { transform: scale(1.08); } 
            70% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* ================================
           Screen 2: PIN Screen
           ================================ */
        #screen-pin {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--white); display: flex; flex-direction: column;
            align-items: center; padding: 60px 20px 40px; z-index: 20;
            transform: translateX(100%); transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .nx-life-logo { font-family: 'Urbanist', sans-serif; font-size: 34px; font-weight: 800; margin-bottom: 35px; letter-spacing: -1.5px; }
        .nx-text { color: var(--navy); }
        .life-text { color: var(--orange); }

        .pin-title { font-size: 22px; font-weight: 600; margin-bottom: 45px; color: var(--navy); }
        .pin-dots { display: flex; gap: 20px; margin-bottom: 50px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background-color: var(--gray-border); transition: 0.2s; }
        .dot.active { background-color: var(--orange); transform: scale(1.2); box-shadow: 0 0 12px rgba(192, 100, 40, 0.4); }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 30px; width: 100%; max-width: 280px; }
        .key {
            width: 70px; height: 70px; border-radius: 50%; border: 1.5px solid var(--orange);
            display: flex; justify-content: center; align-items: center;
            font-size: 26px; font-weight: 500; color: var(--orange);
            background: transparent; cursor: pointer; transition: var(--transition-fast);
        }
        .key:active { background-color: var(--orange); color: var(--white); transform: scale(0.9); }
        .key.del { border: none; color: var(--navy); font-size: 20px; }

        .pin-forgot { margin-top: auto; margin-bottom: 25px; color: var(--gray-text); font-size: 14px; text-decoration: underline; cursor: pointer; }

        /* ================================
           Screen 3: Home Dashboard
           ================================ */
        #screen-home {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color); display: flex; flex-direction: column;
            z-index: 10; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; 
        }
        #screen-home.active { opacity: 1; pointer-events: auto; }

        .main-content { flex: 1; overflow-y: auto; padding: 24px 20px 100px; }
        .main-content::-webkit-scrollbar { display: none; }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .greeting { font-size: 19px; font-weight: 700; color: var(--navy); }
        
        .avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--white); box-shadow: var(--shadow-premium); object-fit: cover; }

        .hero { 
            width: 100%; height: 180px; border-radius: 16px; 
            background: linear-gradient(to bottom, transparent, rgba(0,0,0,0.7)), 
                        url('https://raw.githubusercontent.com/NexusLifeChurch/NxLife_Mbr_Regist/main/images/Logo/banner_alpha.jpg') center/cover;
            display: flex; align-items: flex-end; padding: 20px; margin-bottom: 25px; box-shadow: var(--shadow-premium); 
        }
        .hero-text h2 { color: white; font-size: 20px; font-family: 'Urbanist', sans-serif; }

        /* Menu Horizontal with Shadows & Active state */
        .menu-scroll { display: flex; gap: 18px; overflow-x: auto; padding: 10px 5px 20px; margin-bottom: 10px; }
        .menu-scroll::-webkit-scrollbar { display: none; }
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 65px; cursor: pointer; }
        .menu-icon { 
            width: 58px; height: 58px; border-radius: 50%; background: white; 
            box-shadow: var(--shadow-menu); color: var(--orange);
            display: flex; justify-content: center; align-items: center; font-size: 20px;
            transition: var(--transition-fast);
        }
        .menu-item:active .menu-icon { transform: translateY(4px) scale(0.92); box-shadow: 0 2px 5px rgba(0,0,0,0.1); background: var(--orange-light); }
        .menu-label { font-size: 12px; font-weight: 500; color: var(--navy); }

        .card { background: white; border-radius: 16px; padding: 20px; box-shadow: var(--shadow-premium); display: flex; gap: 15px; margin-bottom: 15px; }
        .card-icon { width: 45px; height: 45px; border-radius: 12px; background: var(--orange-light); color: var(--orange); display: flex; justify-content: center; align-items: center; font-size: 18px; flex-shrink: 0; }
        .card-content h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
        .card-content p { font-size: 13px; color: var(--gray-text); line-height: 1.5; }

        .bottom-nav { position: absolute; bottom: 0; width: 100%; height: 75px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--gray-border); padding-bottom: 10px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--gray-text); font-size: 10px; font-weight: 500; }
        .nav-item.active { color: var(--orange); }
        .nav-item i { font-size: 20px; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="screen-splash">
            <div class="splash-content">
                <img src="https://raw.githubusercontent.com/NexusLifeChurch/NxLife_Mbr_Regist/main/images/Logo/life_logo.png" class="splash-logo-img">
            </div>
            <div class="app-version">v1.0.7</div>
        </div>

        <div id="screen-pin">
            <div class="nx-life-logo"><span class="nx-text">Nx</span><span class="life-text">Life</span></div>
            <div class="pin-title">กรอกรหัส PIN</div>
            <div class="pin-dots" id="pin-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
            <div class="keypad">
                <script>
                    for(let i=1; i<=9; i++) document.write(`<button class="key" onclick="enterPin(${i})">${i}</button>`);
                </script>
                <div></div><button class="key" onclick="enterPin(0)">0</button>
                <button class="key del" onclick="deletePin()"><i class="fa-solid fa-delete-left"></i></button>
            </div>
            <div class="pin-forgot" onclick="alert('คำใบ้คือ: 3456')">ลืมรหัส PIN Code</div>
            <div class="app-version">v1.0.7</div>
        </div>

        <div id="screen-home">
            <div class="main-content">
                <div class="header">
                    <div class="greeting">ชาโลม..ไม่ใช่ชาบู สวัสดี</div>
                    <img src="https://raw.githubusercontent.com/NexusLifeChurch/NxLife_Mbr_Regist/main/images/Logo/NexusLife%20Logo.jpg" class="avatar">
                </div>
                <div class="hero">
                    <div class="hero-text"><h2>ALPHA COURSE</h2></div>
                </div>
                <div class="menu-scroll">
                    <div class="menu-item"><div class="menu-icon"><i class="fa-solid fa-people-roof"></i></div><span class="menu-label">กลุ่มแคร์</span></div>
                    <div class="menu-item"><div class="menu-icon"><i class="fa-solid fa-user-group"></i></div><span class="menu-label">กลุ่มคน</span></div>
                    <div class="menu-item"><div class="menu-icon"><i class="fa-regular fa-calendar-check"></i></div><span class="menu-label">กิจกรรม</span></div>
                    <div class="menu-item"><div class="menu-icon"><i class="fa-solid fa-hand-holding-heart"></i></div><span class="menu-label">ผู้เลี้ยง</span></div>
                    <div class="menu-item"><div class="menu-icon"><i class="fa-solid fa-cake-candles"></i></div><span class="menu-label">วันเกิด</span></div>
                </div>
                <div class="feed-list">
                    <div class="card"><div class="card-icon"><i class="fa-solid fa-house-user"></i></div><div class="card-content"><h3>Family</h3><p>สมาชิกหลักที่ร่วมสร้างชุมชน</p></div></div>
                    <div class="card"><div class="card-icon"><i class="fa-solid fa-user-plus"></i></div><div class="card-content"><h3>Friend</h3><p>ผู้มาเยือนที่กำลังทำความรู้จัก</p></div></div>
                </div>
            </div>
            <div class="bottom-nav">
                <div class="nav-item active"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></div>
                <div class="nav-item"><i class="fa-solid fa-chart-pie"></i><span>ภาพรวม</span></div>
                <div class="nav-item"><i class="fa-regular fa-address-book"></i><span>รายชื่อ</span></div>
                <div class="nav-item"><i class="fa-regular fa-user"></i><span>โปรไฟล์</span></div>
            </div>
        </div>
    </div>

    <script>
        // Automatic Transition Logic
        setTimeout(() => {
            document.getElementById('screen-splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('screen-splash').style.display = 'none';
                document.getElementById('screen-pin').style.transform = 'translateX(0)';
            }, 600);
        }, 2200);

        let currentPin = '';
        const dots = document.querySelectorAll('.dot');
        function enterPin(n) {
            if(currentPin.length < 4) { currentPin += n; updateDots(); if(currentPin.length === 4) setTimeout(checkPin, 300); }
        }
        function deletePin() { if(currentPin.length > 0) { currentPin = currentPin.slice(0, -1); updateDots(); } }
        function updateDots() { dots.forEach((d, i) => d.classList.toggle('active', i < currentPin.length)); }
        function checkPin() {
            if(currentPin === '3456') {
                document.getElementById('screen-pin').style.transform = 'translateX(-100%)';
                document.getElementById('screen-home').classList.add('active');
            } else { alert('PIN ไม่ถูกต้อง'); currentPin = ''; updateDots(); }
        }
    </script>
</body>
</html>
