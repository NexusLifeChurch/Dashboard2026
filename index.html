<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NxLife Community v1.0.27</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --charcoal: #334155;     
            --orange: #C06428;       
            --orange-soft: #FDF3EC;  
            --white: #FFFFFF;
            --bg-app: #FAF7F2;       
            --gray-text: #64748B;
            --gray-border: #E2E8F0;
            --shadow-premium: 0 10px 30px rgba(0,0,0,0.03);
            --shadow-menu: 0 8px 20px rgba(192, 100, 40, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #E2E8F0; 
            color: var(--charcoal);
            display: flex; justify-content: center; 
            height: 100dvh; 
            overflow: hidden;
        }

        #app-container {
            width: 100%; max-width: 430px; height: 100%;
            background-color: var(--bg-app); position: relative; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        .version-tag {
            position: absolute; bottom: 15px; width: 100%; text-align: center;
            font-size: 10px; color: #CBD5E1; 
            font-family: 'Urbanist', sans-serif; letter-spacing: 1px; z-index: 100;
        }

        /* ================================
           Screen 1: Splash Screen
           ================================ */
        #screen-splash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-app); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 30;
            transition: opacity 0.6s ease-in-out;
        }
        
        .splash-content { transform: translateY(-12vh); z-index: 2; }
        
        .logo-heartbeat { 
            width: 210px; 
            animation: heartbeat 1.4s ease-in-out infinite; 
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.08); }
            40% { transform: scale(1); }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* ================================
           Screen 2: PIN Screen
           ================================ */
        #screen-pin {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-app); display: flex; flex-direction: column;
            align-items: center; 
            padding: 45px 20px 20px; 
            z-index: 20;
            transform: translateX(100%); transition: transform 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .pin-logo { font-family: 'Urbanist', sans-serif; font-size: 34px; font-weight: 800; margin-bottom: 15px; letter-spacing: -1.5px; }
        .nx-label { color: var(--charcoal); }
        .life-label { color: var(--orange); }

        .pin-title { font-size: 21px; font-weight: 600; margin-bottom: 25px; color: var(--charcoal); }
        .pin-dots { display: flex; gap: 20px; margin-bottom: 30px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background-color: var(--gray-border); transition: 0.2s; }
        .dot.filled { background-color: var(--orange); transform: scale(1.2); box-shadow: 0 0 12px rgba(192, 100, 40, 0.3); }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px 25px; width: 100%; max-width: 280px; margin-bottom: 25px; }
        .btn-key {
            width: 68px; height: 68px; border-radius: 50%; border: 1.5px solid var(--orange);
            display: flex; justify-content: center; align-items: center;
            font-size: 26px; font-weight: 500; color: var(--orange);
            background: transparent; cursor: pointer; transition: 0.1s;
        }
        .btn-key:active { background-color: var(--orange); color: var(--white); transform: scale(0.9); }
        .btn-del { border: none; color: var(--charcoal); font-size: 20px; background: transparent; }

        .link-forgot { color: var(--gray-text); font-size: 14px; text-decoration: underline; cursor: pointer; padding: 5px; }

        /* ================================
           Screen 3: Home Dashboard
           ================================ */
        #screen-home {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-app); display: flex; flex-direction: column;
            z-index: 10; opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
        }
        #screen-home.visible { opacity: 1; pointer-events: auto; }

        .content-scroll { flex: 1; overflow-y: auto; padding: 24px 20px 20px; }
        .content-scroll::-webkit-scrollbar { display: none; }

        /* ส่วนหัวและแบนเนอร์ของหน้าหลัก */
        .home-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding: 10px 0; }
        .greet-text { font-size: 19px; font-weight: 700; color: var(--charcoal); line-height: 1.4; }
        .profile-img { width: 160px; height: auto; object-fit: contain; }

        .banner-hero { 
            width: 100%; height: 180px; border-radius: 8px; 
            background: linear-gradient(to bottom, transparent, rgba(15,23,42,0.7)), 
                        url('https://github.com/NexusLifeChurch/Dashboard2026/blob/main/Image/NxBkkPlace.jpg?raw=true') center/cover;
            display: flex; align-items: flex-end; padding: 20px; margin-bottom: 25px; box-shadow: var(--shadow-premium); 
        }
        .banner-txt { display: flex; flex-direction: column; gap: 2px; }
        .banner-txt h2 { color: white; font-size: 24px; font-family: 'Urbanist', sans-serif; font-weight: 800; line-height: 1.1; letter-spacing: 0.5px; }
        .banner-txt span { color: rgba(255, 255, 255, 0.85); font-size: 14px; font-family: 'Urbanist', sans-serif; font-weight: 600; letter-spacing: 1px; }

        .horizontal-menu { display: flex; gap: 18px; overflow-x: auto; padding: 10px 5px 20px; margin-bottom: 10px; }
        .horizontal-menu::-webkit-scrollbar { display: none; }
        .menu-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 65px; cursor: pointer; }
        .icon-circle { 
            width: 58px; height: 58px; border-radius: 50%; background: white; 
            box-shadow: var(--shadow-menu); color: var(--orange);
            display: flex; justify-content: center; align-items: center; font-size: 20px;
            transition: 0.1s;
        }
        .menu-btn.active .icon-circle { background: var(--orange); color: white; }
        .menu-btn:active .icon-circle { transform: translateY(4px) scale(0.92); box-shadow: 0 2px 5px rgba(0,0,0,0.08); }
        .menu-txt { font-size: 12px; font-weight: 500; color: var(--charcoal); }

        /* ส่วนหัวสำหรับหน้าย่อย (ภาพรวม, รายชื่อ, ฯลฯ) - ปรับกระชับ */
        #sub-page-header { display: none; align-items: center; gap: 12px; margin-bottom: 20px; padding: 5px 0 15px; border-bottom: 1px solid var(--gray-border); }
        .sub-header-icon { width: 38px; height: 38px; border-radius: 10px; background: var(--orange-soft); color: var(--orange); display: flex; justify-content: center; align-items: center; font-size: 18px; }
        .sub-header-text { display: flex; flex-direction: column; }
        #sub-page-topic { font-size: 12px; color: var(--gray-text); font-weight: 600; margin-bottom: 2px; }
        #sub-page-title { font-size: 20px; font-weight: 700; color: var(--charcoal); line-height: 1.1; }

        /* Feed Cards Section */
        .feed-list { display: flex; flex-direction: column; }
        .info-card { background: white; border-radius: 16px; padding: 20px; box-shadow: var(--shadow-premium); display: flex; gap: 15px; margin-bottom: 15px; }
        .card-ico { width: 45px; height: 45px; border-radius: 12px; background: var(--orange-soft); color: var(--orange); display: flex; justify-content: center; align-items: center; font-size: 18px; flex-shrink: 0; }
        .card-txt h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--charcoal); }
        .card-txt p { font-size: 13px; color: var(--gray-text); line-height: 1.5; }

        /* แถบเมนูล่าง จัดเรียงใหม่และทำปุ่ม Home ให้โดดเด่น */
        .nav-bar { width: 100%; height: 75px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--gray-border); flex-shrink: 0; z-index: 50; padding-bottom: env(safe-area-inset-bottom, 0px); }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--gray-text); font-size: 10px; font-weight: 500; cursor: pointer; transition: 0.3s; width: 20%; }
        .nav-btn.active { color: var(--orange); }
        .nav-btn i { font-size: 20px; }
        
        /* สไตล์พิเศษสำหรับปุ่ม Home ลอยตรงกลาง */
        .home-fab {
            background: var(--orange);
            color: white;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            margin-top: -25px; /* ลอยขึ้นเหนือแถบ */
            box-shadow: 0 4px 12px rgba(192, 100, 40, 0.35);
            transition: 0.3s;
        }
        .nav-btn.active .home-fab { transform: scale(1.08); box-shadow: 0 6px 14px rgba(192, 100, 40, 0.45); }
        .home-fab i { color: white !important; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="screen-splash">
            <div class="splash-content">
                <img src="https://raw.githubusercontent.com/NexusLifeChurch/NxLife_Mbr_Regist/main/images/Logo/life_logo.png" class="logo-heartbeat">
            </div>
            <div class="version-tag">v1.0.27</div>
        </div>

        <div id="screen-pin">
            <div class="pin-logo"><span class="nx-label">Nx</span><span class="life-label">Life</span></div>
            <div class="pin-title">กรอกรหัส PIN</div>
            <div class="pin-dots" id="pin-dots">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="keypad">
                <button class="btn-key" onclick="pressKey(1)">1</button>
                <button class="btn-key" onclick="pressKey(2)">2</button>
                <button class="btn-key" onclick="pressKey(3)">3</button>
                <button class="btn-key" onclick="pressKey(4)">4</button>
                <button class="btn-key" onclick="pressKey(5)">5</button>
                <button class="btn-key" onclick="pressKey(6)">6</button>
                <button class="btn-key" onclick="pressKey(7)">7</button>
                <button class="btn-key" onclick="pressKey(8)">8</button>
                <button class="btn-key" onclick="pressKey(9)">9</button>
                <div></div>
                <button class="btn-key" onclick="pressKey(0)">0</button>
                <button class="btn-key btn-del" onclick="delKey()"><i class="fa-solid fa-delete-left"></i></button>
            </div>
            <div class="link-forgot" onclick="alert('+12345')">ลืมรหัส PIN Code</div>
        </div>

        <div id="screen-home">
            <div class="content-scroll">
                
                <div id="home-top-section">
                    <div class="home-header">
                        <div class="greet-text">ชาโลม.. ไม่ใช่ ชาบู<br>สวัสดี</div>
                        <img src="https://github.com/NexusLifeChurch/Dashboard2026/blob/main/Image/NexusLife%20Logo7.png?raw=true" class="profile-img">
                    </div>
                    <div class="banner-hero">
                        <div class="banner-txt">
                            <h2>NEXUS LIFE</h2>
                            <span>COMMUNITY</span>
                        </div>
                    </div>
                    
                    <div class="horizontal-menu" id="circle-hub-menu">
                        <div class="menu-btn" onclick="selectCircleMenu('care', this)"><div class="icon-circle"><i class="fa-solid fa-people-roof"></i></div><span class="menu-txt">กลุ่มแคร์</span></div>
                        <div class="menu-btn" onclick="selectCircleMenu('people', this)"><div class="icon-circle"><i class="fa-solid fa-user-group"></i></div><span class="menu-txt">กลุ่มคน</span></div>
                        <div class="menu-btn" onclick="selectCircleMenu('event', this)"><div class="icon-circle"><i class="fa-regular fa-calendar-check"></i></div><span class="menu-txt">กิจกรรม</span></div>
                        <div class="menu-btn" onclick="selectCircleMenu('mentor', this)"><div class="icon-circle"><i class="fa-solid fa-hand-holding-heart"></i></div><span class="menu-txt">ผู้เลี้ยง</span></div>
                        <div class="menu-btn" onclick="selectCircleMenu('birthday', this)"><div class="icon-circle"><i class="fa-solid fa-cake-candles"></i></div><span class="menu-txt">วันเกิด</span></div>
                    </div>
                </div>

                <div id="sub-page-header">
                    <div class="sub-header-icon" id="sub-header-icon"><i class="fa-solid fa-database"></i></div>
                    <div class="sub-header-text">
                        <span id="sub-page-topic">ภาพรวมระบบ</span>
                        <h2 id="sub-page-title">ภาพรวม</h2>
