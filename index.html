<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>NxLife Dashboard Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-center">NxLife System Dashboard</h1>
        <div id="debug-log" class="text-red-500 mb-4 font-mono text-sm"></div>
        
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-lg font-semibold mb-4">ส่วนแสดงรูปภาพสมาชิก</h2>
            <div id="image-container" class="grid grid-cols-2 md:grid-cols-4 gap-4">กำลังโหลดข้อมูล...</div>
        </div>
    </div>

    <script>
        // *** โปรดตรวจสอบให้แน่ใจว่า API_URL เป็น URL ล่าสุดจากการ Deploy เป็น Anyone ***
        const API_URL = 'YOUR_WEB_APP_URL_HERE'; 

        async function fetchData() {
            const debugLog = document.getElementById('debug-log');
            const imageContainer = document.getElementById('image-container');
            
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('HTTP Status: ' + response.status);
                
                const data = await response.json();
                
                if (data && data.success) {
                    renderImages(data.members);
                } else {
                    debugLog.innerText = 'Error from API: ' + (data.error || 'ไม่สามารถดึงข้อมูลได้');
                }
            } catch (err) {
                debugLog.innerText = 'Connection Error: ' + err.message + '\n(โปรดเช็ค: 1. Deploy เป็นเวอร์ชันใหม่แล้วหรือไม่ 2. สิทธิ์การเข้าถึงเป็น Anyone หรือไม่)';
                imageContainer.innerHTML = '<p class="text-gray-500">ไม่สามารถเชื่อมต่อข้อมูลได้</p>';
            }
        }

        function renderImages(members) {
            const container = document.getElementById('image-container');
            if (!members || members.length === 0) {
                container.innerHTML = '<p>ไม่พบข้อมูลสมาชิกในระบบ</p>';
                return;
            }
            
            container.innerHTML = members.slice(0, 8).map(m => `
                <div class="border rounded-lg p-2 shadow-sm bg-white">
                    <img src="${m.Url_Image || 'https://via.placeholder.com/150'}" 
                         alt="${m.FullName_Display}" 
                         class="w-full h-32 object-cover rounded-md" 
                         onerror="this.src='https://via.placeholder.com/150'">
                    <p class="text-xs mt-2 text-center truncate font-medium">${m.FullName_Display}</p>
                </div>
            `).join('');
        }

        // เริ่มต้นการทำงานเมื่อโหลดหน้าเว็บ
        fetchData();
    </script>
</body>
</html>
