<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NxLife Community</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --navy: #0F172A;
            --blue: #0284C7; 
            --blue-light: #E0F2FE; 
            --white: #FFFFFF;
            --bg-color: #FAFAFB;
            --gray-text: #64748B;
            --gray-border: #E2E8F0;
            --shadow-premium: 0 10px 30px rgba(0,0,0,0.04);
            --shadow-bottom: 0 -5px 20px rgba(0,0,0,0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #E5E7EB; 
            color: var(--navy);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 430px; 
            height: 100%;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        /* ================================
           Screen 1: Splash Screen
           ================================ */
        #screen-splash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            /* เปลี่ยนความเร็วการจางหายให้ช้าลงและนุ่มนวลขึ้น */
            transition: opacity 1.2s ease-in-out; 
        }
        
        .splash-bg-top {
            position: absolute; top: -50px; left: -50px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, var(--blue-light) 0%, transparent 70%);
            border-radius: 50%; opacity: 0.8;
        }
        
        .splash-bg-bottom {
            position: absolute; bottom: -50px; right: -50px;
            width: 250px; height: 250px;
            background: radial-gradient(circle, var(--blue-light) 0%, transparent 70%);
            border-radius: 50%; opacity: 0.8;
        }

        /* จัดตำแหน่งโลโก้ให้ค่อนไปด้านบน */
        .splash-content {
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateY(-10vh); /* ดันขึ้นด้านบน 10% ของหน้าจอ */
            z-index: 2;
        }

        .splash-logo-img {
            width: 220px; 
            object-fit: contain;
            animation: heartbeat 1.5s infinite; /* อนิเมชั่นหัวใจเต้น */
        }

        .fallback-text {
            position: absolute;
            z-index: -1;
            font-weight: bold;
            color: var(--blue-light);
            font-size: 24px;
        }

        /* อนิเมชั่นหัวใจเต้น (Heartbeat) */
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.08); } /* ตุบที่ 1 */
            28% { transform: scale(1); }
            42% { transform: scale(1.08); } /* ตุบที่ 2 */
            70% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        /* ================================
           Screen 2: PIN Screen
           ================================ */
        #screen-pin {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px;
            z-index: 20;
            transform: translateX(100%);
            /* เลื่อนเข้ามาอย่างนุ่มนวล */
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .pin-logo-img { height: 40px; margin-bottom: 30px; }
        .pin-title { font-size: 22px; font-weight: 600; margin-bottom: 10px; color: var(--navy); }
        .pin-hint { font-size: 14px; color: var(--gray-text); margin-bottom: 30px; font-weight: 500; }
        
        .pin-dots { display: flex; gap: 20px; margin-bottom: 50px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background-color: var(--gray-border); transition: var(--transition); }
        .dot.active { background-color: var(--blue); transform: scale(1.2); box-shadow: 0 0 10px rgba(2, 132, 199, 0.4); }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 30px; width: 100%; max-width: 280px; }
        .key {
            width: 70px; height: 70px; border-radius: 50%;
            border: 1.5px solid var(--blue);
            display: flex; justify-content: center; align-items: center;
            font-size: 26px; font-weight: 500; color: var(--blue);
            background: transparent; cursor: pointer;
            transition: var(--transition);
            margin: auto;
        }
        .key:active { background-color: var(--blue); color: var(--white); transform: scale(0.95); }
        .key.del { border: none; color: var(--navy); font-size: 20px; }
        .key.del:active { background: transparent; color: var(--blue); }

        .pin-forgot { margin-top: auto; color: var(--gray-text); font-size: 14px; text-decoration: underline; padding: 10px; }

        /* ================================
           Screen 3: Home Dashboard
           ================================ */
        #screen-home {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-color);
            display: flex; flex-direction: column;
            z-index: 10;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .main-content {
            flex: 1; overflow-y: auto; overflow-x: hidden;
            padding: 24px 20px 100px; 
        }
        .main-content::-webkit-scrollbar { display: none; }

        /* Header */
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
        .greeting { font-size: 22px; font-weight: 700; color: var(--navy); }
        .header-actions { display: flex; align-items: center; gap: 15px; }
        .bell-icon { position: relative; font-size: 20px; color: var(--navy); }
        .badge { position: absolute; top: -5px; right: -8px; background-color: #EF4444; color: white; font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 10px; border: 2px solid var(--bg-color); }
        
        .avatar { 
            width: 44px; height: 44px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--white);
            box-shadow: var(--shadow-premium);
        }

        /* Quick Actions */
        .quick-actions { display: flex; gap: 10px; margin-bottom: 24px; }
        .pill { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--gray-border); background: var(--white); transition: var(--transition); color: var(--navy); }
        .pill.active { background: var(--navy); color: var(--white); border-color: var(--navy); }

        /* Hero Banner */
        .hero { 
            width: 100%; height: 180px; 
            border-radius: 16px; 
            background: linear-gradient(to bottom, rgba(15, 23, 42, 0.1), rgba(15, 23, 42, 0.8)), 
                        url('https://raw.githubusercontent.com/NexusLifeChurch/NxLife_Mbr_Regist/main/images/Logo/banner_alpha.jpg') center/cover no-repeat;
            color: white; 
            display: flex; align-items: flex-end; 
            padding: 20px; margin-bottom: 30px; 
            position: relative; overflow: hidden; 
            box-shadow: var(--shadow-premium); 
        }
        .hero-text h2 { font-size: 20px; font-weight: 700; z-index: 1; position: relative; text-shadow: 0 2px 4px rgba(0,0,0,0.5); font-family: 'Urbanist', sans-serif;}
        .hero-text p { font-size: 13px; opacity: 0.9; z-index: 1; position: relative; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }

        /* Upper Horizontal Menu */
        .menu-scroll { display: flex; gap: 16px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px; scroll-snap-type: x mandatory; }
        .menu-scroll::-webkit-scrollbar { display: none; }
        .menu-item { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 64px; scroll-snap-align: start; cursor: pointer; }
        .menu-icon { width: 56px; height: 56px; border-radius: 50%; background-color: var(--white); box-shadow: var(--shadow-premium); display: flex; justify-content: center; align-items: center; font-size: 20px; color: var(--blue); transition: var(--transition); }
        .menu-item:active .menu-icon { transform: scale(0.9); background-color: var(--blue-light); }
        .menu-label { font-size: 12px; font-weight: 500; color: var(--navy); }

        .section-
