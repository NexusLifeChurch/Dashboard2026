<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NxLife Community</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --charcoal: #334155;     
            --orange: #C06428;       
            --orange-soft: #FDF3EC;  
            --white: #FFFFFF;
            --bg-app: #FAF7F2;       
            --gray-text: #64748B;
            --gray-border: #E2E8F0;
            --shadow-premium: 0 10px 30px rgba(0,0,0,0.03);
            --shadow-menu: 0 8px 20px rgba(192, 100, 40, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #E2E8F0; 
            color: var(--charcoal);
            display: flex; justify-content: center; height: 100vh; overflow: hidden;
        }

        #app-container {
            width: 100%; max-width: 430px; height: 100%;
            background-color: var(--bg-app); position: relative; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,0.1);
        }

        .version-tag {
            position: absolute; bottom: 15px; width: 100%; text-align: center;
            font-size: 10px; color: #CBD5E1; 
            font-family: 'Urbanist', sans-serif; letter-spacing: 1px; z-index: 100;
        }

        /* ================================
           Screen 1: Splash Screen
           ================================ */
        #screen-splash {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-app); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 30;
            transition: opacity 0.6s ease-in-out;
        }
        
        .splash-content { transform: translateY(-12vh); z-index: 2; }
        
        /* ปรับให้กลับมาเต้นแบบวนลูปเรื่อยๆ (infinite) ตามคำขอ */
        .logo-heartbeat { 
            width: 210px; 
            animation: heartbeat 1.4s ease-in-out infinite; 
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            20% { transform: scale(1.08); }
            40% { transform: scale(1); }
            60% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }

        /* ================================
           Screen 2: PIN Screen
           ================================ */
        #screen-pin {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-app); display: flex; flex-direction: column;
            align-items: center; padding: 60px 20px 40px; z-index: 20;
            transform: translateX(100%); transition: transform 0.5s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .pin-logo { font-family: 'Urbanist', sans-serif; font-size: 34px; font-weight: 800; margin-bottom: 35px; letter-spacing: -1.5px; }
        .nx-label { color: var(--charcoal); }
        .life-label { color: var(--orange); }

        .pin-title { font-size: 22px; font-weight: 600; margin-bottom: 45px; color: var(--charcoal); }
        .pin-dots { display: flex; gap: 20px; margin-bottom: 50px; }
        .dot { width: 14px; height: 14px; border-radius: 50%; background-color: var(--gray-border); transition: 0.2s; }
        .dot.filled { background-color: var(--orange); transform: scale(1.2); box-shadow: 0 0 12px rgba(192, 100, 40, 0.3); }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px 30px; width: 100%; max-width: 280px; }
        .btn-key {
            width: 70px; height: 70px; border-radius: 50%; border: 1.5px solid var(--orange);
            display: flex; justify-content: center; align-items: center;
            font-size: 26px; font-weight: 500; color: var(--orange);
            background: transparent; cursor: pointer; transition: 0.1s;
        }
        .btn-key:active { background-color: var(--orange); color: var(--white); transform: scale(0.9); }
        .btn-del { border: none; color: var(--charcoal); font-size: 20px; }

        .link-forgot { margin-top: auto; margin-bottom: 25px; color: var(--gray-text); font-size: 14px; text-decoration: underline; cursor: pointer; }

        /* ================================
           Screen 3: Home Dashboard
           ================================ */
        #screen-home {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--bg-app); display: flex; flex-direction: column;
            z-index: 10; opacity: 0; transition: opacity 0.5s ease; pointer-events: none;
        }
        #screen-home.visible { opacity: 1; pointer-events: auto; }

        .content-scroll { flex: 1; overflow-y: auto; padding: 24px 20px 100px; }
        .content-scroll::-webkit-scrollbar { display: none; }

        .home-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .greet-text { font-size: 19px; font-weight: 700; color: var(--charcoal); line-height: 1.3; }
        
        .profile-img { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--white); box-shadow: var(--shadow-premium); object-fit: cover; }

        .banner-hero { 
            width: 100%; height: 180px; border-radius: 16px; 
            background: linear-gradient(to bottom, transparent, rgba(15,23,42,0.7)), 
                        url('https://raw.githubusercontent.com/NexusLifeChurch/NxLife_Mbr_Regist/main/images/Logo/banner_alpha.jpg') center/cover;
            display: flex; align-items: flex-end; padding: 20px; margin-bottom: 25px; box-shadow: var(--shadow-premium); 
        }
        .banner-hero h2 { color: white; font-size: 20px; font-family: 'Urbanist', sans-serif; }

        .horizontal-menu { display: flex; gap: 18px; overflow-x: auto; padding: 10px 5px 20px; margin-bottom: 10px; }
        .horizontal-menu::-webkit-scrollbar { display: none; }
        .menu-btn { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 65px; cursor: pointer; }
        .icon-circle { 
            width: 58px; height: 58px; border-radius: 50%; background: white; 
            box-shadow: var(--shadow-menu); color: var(--orange);
            display: flex; justify-content: center; align-items: center; font-size: 20px;
            transition: 0.1s;
        }
        .menu-btn:active .icon-circle { transform: translateY(4px) scale(0.92); box-shadow: 0 2px 5px rgba(0,0,0,0.08); background: var(--orange-soft); }
        .menu-txt { font-size: 12px; font-weight: 500; color: var(--charcoal); }

        .info-card { background: white; border-radius: 16px; padding: 20px; box-shadow: var(--shadow-premium); display: flex; gap: 15px; margin-bottom: 15px; }
        .card-ico { width: 45px; height: 45px; border-radius: 12px; background: var(--orange-soft); color: var(--orange); display: flex; justify-content: center; align-items: center; font-size: 18px; flex-shrink: 0; }
        .card-txt h3 { font-size: 16px; font-weight: 700; margin-bottom: 4px; color: var(--charcoal); }
        .card-txt p { font-size: 13px; color: var(--gray-text); line-height: 1.5; }

        .nav-bar { position: absolute; bottom: 0; width: 100%; height: 75px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid var(--gray-border); padding-bottom: 10px; }
        .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--gray-text); font-size: 10px; font-weight: 500; cursor: pointer; transition: 0.3s; }
        .nav-btn.active { color: var(--orange); }
        .nav-btn i { font-size: 20px; }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="screen-splash">
            <div class="splash-content">
                <img src="https://raw.githubusercontent.com/NexusLifeChurch/NxLife_Mbr_Regist/main/images/Logo/life_logo.png" class="logo-heartbeat">
            </div>
            <div class="version-tag">v1.0.11</div>
        </div>

        <div id="screen-pin">
            <div class="pin-logo"><span class="nx-label">Nx</span><span class="life-label">Life</span></div>
            <div class="pin-title">กรอกรหัส PIN</div>
            <div class="pin-dots" id="pin-dots">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="keypad">
                <button class="btn-key" onclick="pressKey(1)">1</button>
                <button class="btn-key" onclick="pressKey(2)">2</button>
                <button class="btn-key" onclick="pressKey(3)">3</button>
                <button class="btn-key" onclick="pressKey(4)">4</button>
                <button class="btn-key" onclick="pressKey(5)">5</button>
                <button class="btn-key" onclick="pressKey(6)">6</button>
                <button class="btn-key" onclick="pressKey(7)">7</button>
                <button class="btn-key" onclick="pressKey(8)">8</button>
                <button class="btn-key" onclick="pressKey(9)">9</button>
                <div></div>
                <button class="btn-key" onclick="pressKey(0)">0</button>
                <button class="btn-key btn-del" onclick="delKey()"><i class="fa-solid fa-delete-left"></i></button>
            </div>
            <div class="link-forgot" onclick="alert('คำใบ้คือ: 3456')">ลืมรหัส PIN Code</div>
            <div class="version-tag">v1.0.11</div>
        </div>

        <div id="screen-home">
            <div class="content-scroll">
                <div class="home-header">
                    <div class="greet-text">ชาโลม..ไม่ใช่ชาบู<br>สวัสดี</div>
                    <img src="https://raw.githubusercontent.com/NexusLifeChurch/NxLife_Mbr_Regist/main/images/Logo/NexusLife%20Logo.jpg" class="profile-img">
                </div>
                <div class="banner-hero">
                    <div class="banner-txt"><h2>ALPHA COURSE</h2></div>
                </div>
                <div class="horizontal-menu">
                    <div class="menu-btn"><div class="icon-circle"><i class="fa-solid fa-people-roof"></i></div><span class="menu-txt">กลุ่มแคร์</span></div>
                    <div class="menu-btn"><div class="icon-circle"><i class="fa-solid fa-user-group"></i></div><span class="menu-txt">กลุ่มคน</span></div>
                    <div class="menu-btn"><div class="icon-circle"><i class="fa-regular fa-calendar-check"></i></div><span class="menu-txt">กิจกรรม</span></div>
                    <div class="menu-btn"><div class="icon-circle"><i class="fa-solid fa-hand-holding-heart"></i></div><span class="menu-txt">ผู้เลี้ยง</span></div>
                    <div class="menu-btn"><div class="icon-circle"><i class="fa-solid fa-cake-candles"></i></div><span class="menu-txt">วันเกิด</span></div>
                </div>
                <div class="feed-list">
                    <div class="info-card">
                        <div class="card-ico"><i class="fa-solid fa-house-user"></i></div>
                        <div class="card-txt"><h3>Family</h3><p>สมาชิกหลักที่ผูกพันและร่วมสร้างชุมชนอย่างต่อเนื่อง</p></div>
                    </div>
                    <div class="info-card">
                        <div class="card-ico"><i class="fa-solid fa-user-plus"></i></div>
                        <div class="card-txt"><h3>Friend</h3><p>ผู้มาเยือนที่กำลังทำความรู้จักและเริ่มต้นเติบโต</p></div>
                    </div>
                </div>
            </div>
            <div class="nav-bar">
                <div class="nav-btn active"><i class="fa-solid fa-house"></i><span>หน้าหลัก</span></div>
                <div class="nav-btn"><i class="fa-solid fa-chart-pie"></i><span>ภาพรวม</span></div>
                <div class="nav-btn"><i class="fa-regular fa-address-book"></i><span>รายชื่อ</span></div>
                <div class="nav-btn"><i class="fa-regular fa-user"></i><span>โปรไฟล์</span></div>
            </div>
        </div>
    </div>

    <script>
        // บังคับเปลี่ยนหน้าไปหน้า PIN ทันทีที่ครบ 2 วินาที (2000 มิลลิวินาที)
        setTimeout(() => {
