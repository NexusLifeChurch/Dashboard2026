<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NxLife Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #fcfbf8; color: #4a3b32; font-family: sans-serif; }
        .navbar-nxl { background-color: #8c705f; }
        .card-premium { border: none; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); background: white; }
        .text-gold { color: #b8975a; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-nxl shadow-sm mb-4">
        <div class="container text-center">
            <span class="navbar-brand mb-0 h5 w-100">🕊️ NxLife Leader Dashboard</span>
        </div>
    </nav>

    <div class="container text-center">
        <div class="row g-3">
            <div class="col-6">
                <div class="card card-premium p-3">
                    <small class="text-muted">Family</small>
                    <h2 id="ui-family" class="text-gold fw-bold">...</h2>
                </div>
            </div>
            <div class="col-6">
                <div class="card card-premium p-3">
                    <small class="text-muted">Friends</small>
                    <h2 id="ui-friends" class="fw-bold">...</h2>
                </div>
            </div>
        </div>
        <div class="mt-4">
            <small class="text-muted" id="ui-update">กำลังดึงข้อมูล...</small>
        </div>
    </div>

    <script>
        // ⚠️ ใช้ URL อันล่าสุดที่คุณเปิดแล้วขึ้น Success เมื่อกี้นะครับ
        const API_URL = 'https://script.google.com/macros/s/AKfycbybSGDEUgvn-Wzd3H-O-M01BvDbV8f0iS1aAsZ2b0IndpYiKpAYhhopToTgl5QgVeLH/exec';

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                
                // ตรวจสอบว่ามีข้อมูลส่งมาจริงไหม
                if (data.success) {
                    // หาตำแหน่งของคอลัมน์ Nxl_Status
                    const statusIdx = data.headers.indexOf('Nxl_Status');
                    
                    // สมมติว่าเราจะเริ่มนับจากข้อมูลจริง (ซึ่งดึงมาจาก GAS ในอนาคต)
                    // แต่ตอนนี้เพื่อให้หน้าจอไม่ว่าง เราจะใช้ตัวเลข rowCount มาโชว์ก่อน
                    // หรือถ้าคุณใช้โค้ด Code.gs ตัว "ไม้ตาย" ที่ผมนับให้ ให้ดึงจากตรงนั้น
                    
                    document.getElementById('ui-family').innerText = data.rowCount; // โชว์ยอดรวมไปก่อนเพื่อทดสอบ
                    document.getElementById('ui-friends').innerText = "Online";
                    document.getElementById('ui-update').innerText = 'อัปเดตล่าสุด: ' + data.lastUpdate;
                }
            } catch (err) {
                document.getElementById('ui-update').innerText = 'เกิดข้อผิดพลาดในการแสดงผล';
            }
        }
        fetchData();
    </script>
</body>
</html>
