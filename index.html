<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NxLife Community</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Urbanist:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --navy: #0F172A;
            --blue: #0284C7; /* เปลี่ยนเป็นโทนสีฟ้า Premium Sky Blue */
            --blue-light: #E0F2FE; /* สีฟ้าอ่อนสำหรับพื้นหลังไอคอน */
            --white: #FFFFFF;
            --bg-color: #FAFAFB;
            --gray-text: #64748B;
            --gray-border: #E2E8F0;
            --shadow-premium: 0 10px 30px rgba(0,0,0,0.04);
            --shadow-bottom: 0 -5px 20px rgba(0,0,0,0.04);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: #E5E7EB; 
            color: var(--navy);
            display: flex;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            width: 100%;
            max-width: 430px; 
            height: 100%;
            background-color: var(--bg-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(0,0,0,0.1);
        }

        h1, h2, h3, h4, h5 { font-family: 'Urbanist', 'Prompt', sans-serif; }

        /* ================================
           Screen 1: Splash Screen
           ================================ */
        #screen-splash {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--white);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 30;
            transition: opacity 0.5s ease;
        }
        .splash-bg-top {
            position: absolute; top: -50px; left: -50px;
            width: 200px; height: 200px;
            background: radial-gradient(circle, var(--blue-light) 0%, transparent 70%);
            border-radius: 50%; opacity: 0.8;
        }
        .splash-bg-bottom {
            position: absolute; bottom: -50px; right: -50px;
            width: 250px; height: 250px;
            background: radial-gradient(circle, var(--blue-light) 0%, transparent 70%);
            border-radius: 50%; opacity: 0.8;
        }
        .splash-logo-img {
            width: 220px; /* ขนาด Logo หน้าแรก */
            z-index: 2;
            object-fit: contain;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        /* ================================
           Screen 2: PIN Screen
           ================================ */
        #screen-pin {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: var(--white);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px 40px;
            z-index: 20;
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .pin-logo-img { height: 40px; margin-bottom: 30px; }
        .pin-title { font-size: 22px; font-weight: 600; margin-bottom: 10px; color: var(--navy); }
        .pin-hint { font-size: 14px; color: var(--gray-text); margin-bottom: 30px; font-weight: 500; }
        
        .pin-dots { display: flex; gap: 20px; margin-bottom: 50px;
