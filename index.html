<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard2026</title>

  <style>
    body{
      margin:0;
      font-family:Arial, sans-serif;
      background:#f5f5f5;
      display:flex;
      justify-content:center;
      align-items:center;
      height:100vh;
    }

    .card{
      background:white;
      padding:40px;
      border-radius:20px;
      box-shadow:0 4px 15px rgba(0,0,0,0.1);
      text-align:center;
    }

    h1{
      color:#333;
    }

    p{
      color:#666;
    }

    button{
      margin-top:20px;
      padding:12px 24px;
      border:none;
      border-radius:10px;
      background:#007bff;
      color:white;
      cursor:pointer;
      font-size:16px;
    }

    button:hover{
      background:#0056b3;
    }
  </style>
</head>

<body>

  <div class="card">
    <h1>Hello GitHub Pages 🚀</h1>
    <p>เว็บไซต์แรกของฉันบน GitHub</p>

    <button onclick="showMessage()">
      คลิกที่นี่
    </button>
  </div>

  <script>
    function showMessage(){
      alert("ยินดีต้อนรับสู่ Dashboard2026 🎉");
    }
  </script>

</body>
</html>
