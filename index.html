<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>NxLife Dashboard Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl font-bold mb-6 text-center">NxLife System Dashboard</h1>
        <div id="debug-log" class="text-red-500 mb-4 font-mono text-sm"></div>
        
        <div class="bg-white p-6 rounded-lg shadow-md mb-8">
            <h2 class="text-lg font-semibold mb-4">ส่วนแสดงรูปภาพสมาชิก</h2>
            <div id="image-container" class="grid grid-cols-2 md:grid-cols-4 gap-4">กำลังโหลด...</div>
        </div>
    </div>

    <script>
        const API_URL = 'YOUR_WEB_APP_URL_HERE'; // *** ใส่ URL ของคุณที่นี่ ***

        async function fetchData() {
            const debugLog = document.getElementById('debug-log');
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('HTTP Status: ' + response.status);
                
                const data = await response.json();
                
                if (data.success) {
                    renderImages(data.members);
                } else {
                    debugLog.innerText = 'Error from API: ' + data.error;
                }
            } catch (err) {
                debugLog.innerText = 'Connection Error: ' + err.message + '\n(โปรดเช็คว่า URL ถูกต้องและ Deploy เป็น Anyone แล้ว)';
            }
        }

        function renderImages(members) {
            const container = document.getElementById('image-container');
            container.innerHTML = members.length > 0 ? members.slice(0, 4).map(m => `
                <div class="border rounded-lg p-2">
                    <img src="${m.Url_Image || 'https://via.placeholder.com/150'}" class="w-full h-32 object-cover" onerror="this.src='https://via.placeholder.com/150'">
                    <p class="text-xs mt-2 text-center truncate">${m.FullName_Display}</p>
                </div>
            `).join('') : '<p>ไม่พบข้อมูลสมาชิก</p>';
        }

        fetchData();
    </script>
</body>
</html>
